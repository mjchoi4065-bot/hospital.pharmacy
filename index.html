
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>장소 검색 서비스</title>

    <style>
        /* 전체 페이지의 기본 설정 */
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, "Malgun Gothic", sans-serif;
            color: #222;
        }

        /* 화면을 왼쪽과 오른쪽으로 나누기 */
        .container {
            display: flex;
            width: 100%;
            height: 100vh;
            height: 100dvh;
        }

        /* 왼쪽 검색 영역 */
        .sidebar {
            display: flex;
            flex-direction: column;
            width: 380px;
            min-width: 320px;
            padding: 24px;
            background-color: #fff;
            border-right: 1px solid #ddd;
            z-index: 1;
        }

        h1 {
            margin: 0 0 8px;
            font-size: 25px;
        }

        .description {
            margin: 0 0 20px;
            color: #777;
            font-size: 14px;
        }

        /* 검색창과 버튼 */
        .search-form {
            display: flex;
            gap: 8px;
        }

        #searchInput {
            flex: 1;
            min-width: 0;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }

        #searchInput:focus {
            border-color: #3478f6;
        }

        #searchButton {
            padding: 0 16px;
            border: none;
            border-radius: 8px;
            background-color: #3478f6;
            color: white;
            font-size: 15px;
            cursor: pointer;
        }

        #searchButton:hover {
            background-color: #2464d8;
        }

        #searchButton:disabled {
            background-color: #aaa;
            cursor: not-allowed;
        }

        /* 현재 상태를 알려주는 메시지 */
        #statusMessage {
            margin: 16px 0 10px;
            color: #666;
            font-size: 13px;
            line-height: 1.5;
        }

        /* 검색 결과 목록 */
        #resultList {
            flex: 1;
            overflow-y: auto;
            border-top: 1px solid #eee;
        }

        .result-item {
            padding: 16px 4px;
            border-bottom: 1px solid #eee;
            cursor: pointer;
        }

        .result-item:hover {
            background-color: #f5f8ff;
        }

        .place-name {
            margin-bottom: 7px;
            font-size: 16px;
            font-weight: bold;
        }

        .place-address {
            margin-bottom: 5px;
            color: #666;
            font-size: 13px;
            line-height: 1.5;
        }

        .place-phone {
            color: #3478f6;
            font-size: 12px;
        }

        .place-link {
            display: inline-block;
            margin-top: 8px;
            color: #3478f6;
            font-size: 12px;
            text-decoration: none;
        }

        .place-link:hover {
            text-decoration: underline;
        }

        /* 오른쪽 지도 영역 */
        #map {
            flex: 1;
            min-width: 0;
            height: 100%;
            background-color: #f1f3f5;
        }

        /* 화면이 좁아졌을 때의 배치 */
        @media (max-width: 700px) {
            .container {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                min-width: 0;
                height: 48%;
                min-height: 250px;
                padding: 16px;
            }

            #map {
                width: 100%;
                height: 52%;
                min-height: 200px;
            }

            h1 {
                font-size: 21px;
            }
        }
    </style>
</head>

<body>
    <div class="container">

        <!-- 왼쪽 검색창과 결과 목록 -->
        <aside class="sidebar">
            <h1>장소 검색</h1>
            <p class="description">
                찾고 싶은 장소의 이름을 입력하세요.
            </p>

            <form class="search-form" id="searchForm">
                <input
                    type="text"
                    id="searchInput"
                    placeholder="예: 카페, 도서관, 맛집"
                    aria-label="검색할 장소"
                    autocomplete="off"
                >
                <button type="submit" id="searchButton" disabled>
                    검색
                </button>
            </form>

            <p id="statusMessage" role="status" aria-live="polite">
                지도를 불러오는 중입니다.
            </p>

            <div id="resultList"></div>
        </aside>

        <!-- 오른쪽 지도 -->
        <main id="map" aria-label="카카오 지도"></main>

    </div>

    <script>
        // 카카오 JavaScript SDK에 사용할 키
        const kakaoKey = "5411a501c2e1f61e92cfa9800f5faead";

        // HTML 요소를 가져옵니다.
        const searchForm = document.getElementById("searchForm");
        const searchInput = document.getElementById("searchInput");
        const searchButton = document.getElementById("searchButton");
        const statusMessage = document.getElementById("statusMessage");
        const resultList = document.getElementById("resultList");

        // 지도와 검색에 필요한 변수를 선언합니다.
        let map = null;
        let places = null;
        let currentMarker = null;
        let markers = [];
        let infoWindow = null;
        let currentLocation = null;

        // 기본 위치는 서울시청으로 설정합니다.
        const defaultLatitude = 37.5665;
        const defaultLongitude = 126.9780;

        // 지도 SDK를 비동기 방식으로 불러옵니다.
        const kakaoScript = document.createElement("script");

        kakaoScript.src =
            "https://dapi.kakao.com/v2/maps/sdk.js" +
            "?appkey=" + encodeURIComponent(kakaoKey) +
            "&libraries=services&autoload=false";

        kakaoScript.async = true;

        // SDK 파일을 불러오지 못한 경우를 처리합니다.
        kakaoScript.onerror = function () {
            statusMessage.textContent =
                "지도를 불러오지 못했습니다. API 키와 인터넷 연결을 확인하세요.";
        };

        document.head.appendChild(kakaoScript);

        // SDK 파일 로드가 끝난 후 실행합니다.
        kakaoScript.onload = function () {

            // 지도 API 내부의 초기화까지 완료된 후 실행합니다.
            kakao.maps.load(function () {
                initializeMap();
            });
        };

        // 지도를 초기화하는 함수입니다.
        function initializeMap() {
            try {
                const mapContainer = document.getElementById("map");

                // 기본 위치를 중심으로 지도를 생성합니다.
                map = new kakao.maps.Map(mapContainer, {
                    center: new kakao.maps.LatLng(
                        defaultLatitude,
                        defaultLongitude
                    ),
                    level: 5
                });

                // 장소 검색 객체와 정보창을 생성합니다.
                places = new kakao.maps.services.Places(map);

                infoWindow = new kakao.maps.InfoWindow({
                    zIndex: 10
                });

                // 지도 타일이 로드된 후 위치 확인을 시작합니다.
                kakao.maps.event.addListener(
                    map,
                    "tilesloaded",
                    function () {
                        requestCurrentLocation();
                    }
                );

                // 검색 기능을 활성화합니다.
                searchButton.disabled = false;

                statusMessage.textContent =
                    "현재 위치를 확인하고 있습니다.";

            } catch (error) {
                console.error("지도 초기화 오류:", error);

                statusMessage.textContent =
                    "지도 초기화에 실패했습니다. 설정을 확인하세요.";
            }
        }

        // 브라우저에 현재 위치 권한을 요청하는 함수입니다.
        let locationRequested = false;

        function requestCurrentLocation() {
            // 지도 타일 로드 이벤트가 여러 번 발생해도 한 번만 실행합니다.
            if (locationRequested) {
                return;
            }

            locationRequested = true;

            if (!navigator.geolocation) {
                statusMessage.textContent =
                    "현재 위치 기능을 지원하지 않는 브라우저입니다.";
                return;
            }

            navigator.geolocation.getCurrentPosition(
                function (position) {
                    // 위치 확인에 성공하면 위도와 경도를 저장합니다.
                    const latitude = position.coords.latitude;
                    const longitude = position.coords.longitude;

                    currentLocation =
                        new kakao.maps.LatLng(latitude, longitude);

                    // 지도 중심을 현재 위치로 이동합니다.
                    map.setCenter(currentLocation);

                    // 현재 위치 마커를 표시합니다.
                    if (currentMarker) {
                        currentMarker.setMap(null);
                    }

                    currentMarker = new kakao.maps.Marker({
                        map: map,
                        position: currentLocation
                    });

                    statusMessage.textContent =
                        "현재 위치를 확인했습니다. 장소를 검색해 보세요.";
                },
                function (error) {
                    // 위치 권한 거부나 위치 확인 실패 시 기본 위치를 유지합니다.
                    console.warn("현재 위치 확인 실패:", error);

                    if (error.code === 1) {
                        statusMessage.textContent =
                            "위치 권한이 거부되었습니다. 서울시청을 기준으로 검색합니다.";
                    } else {
                        statusMessage.textContent =
                            "현재 위치를 확인할 수 없습니다. 서울시청을 기준으로 검색합니다.";
                    }
                },
                {
                    enableHighAccuracy: false,
                    timeout: 10000,
                    maximumAge: 60000
                }
            );
        }

        // 검색창에서 Enter 키를 누르거나 검색 버튼을 누르면 실행합니다.
        searchForm.addEventListener("submit", function (event) {
            event.preventDefault();

            if (!map || !places) {
                statusMessage.textContent =
                    "지도를 불러오는 중입니다. 잠시 후 다시 시도하세요.";
                return;
            }

            const keyword = searchInput.value.trim();

            if (keyword === "") {
                statusMessage.textContent =
                    "검색할 장소 이름을 입력하세요.";
                searchInput.focus();
                return;
            }

            searchPlaces(keyword);
        });

        // 입력한 키워드로 장소를 검색하는 함수입니다.
        function searchPlaces(keyword) {
            statusMessage.textContent =
                "'" + keyword + "' 검색 중입니다.";

            resultList.replaceChildren();

            // 이전 검색에서 표시한 마커를 제거합니다.
            removeMarkers();

            const searchOptions = {
                size: 15
            };

            // 현재 위치가 있으면 그 위치를 검색 기준으로 사용합니다.
            if (currentLocation) {
                searchOptions.location = currentLocation;
                searchOptions.sort =
                    kakao.maps.services.SortBy.DISTANCE;
            }

            places.keywordSearch(
                keyword,
                function (data, status) {
                    // 검색 결과가 있는 경우입니다.
                    if (status === kakao.maps.services.Status.OK) {
                        displayResults(data);

                        statusMessage.textContent =
                            "검색 결과 " + data.length + "개를 찾았습니다.";

                    } else if (
                        status === kakao.maps.services.Status.ZERO_RESULT
                    ) {
                        statusMessage.textContent =
                            "검색 결과가 없습니다. 다른 검색어를 입력해 보세요.";

                    } else {
                        statusMessage.textContent =
                            "검색 중 오류가 발생했습니다. 잠시 후 다시 시도하세요.";
                    }
                },
                searchOptions
            );
        }

        // 검색 결과를 왼쪽 목록과 지도에 표시합니다.
        function displayResults(data) {
            const bounds = new kakao.maps.LatLngBounds();

            data.forEach(function (place, index) {
                const position = new kakao.maps.LatLng(
                    Number(place.y),
                    Number(place.x)
                );

                // 지도에 장소 마커를 추가합니다.
                const marker = new kakao.maps.Marker({
                    map: map,
                    position: position
                });

                markers.push(marker);
                bounds.extend(position);

                // 검색 결과 항목을 생성합니다.
                const item = document.createElement("div");
                item.className = "result-item";
                item.tabIndex = 0;
                item.setAttribute("role", "button");
                item.setAttribute(
                    "aria-label",
                    place.place_name + " 지도에서 보기"
                );

                const name = document.createElement("div");
                name.className = "place-name";
                name.textContent = (index + 1) + ". " + place.place_name;

                const address = document.createElement("div");
                address.className = "place-address";
                address.textContent =
                    place.road_address_name ||
                    place.address_name ||
                    "주소 정보 없음";

                item.appendChild(name);
                item.appendChild(address);

                // 전화번호가 있으면 함께 표시합니다.
                if (place.phone) {
                    const phone = document.createElement("div");
                    phone.className = "place-phone";
                    phone.textContent = place.phone;
                    item.appendChild(phone);
                }

                // 카카오맵의 장소 상세 페이지 링크를 추가합니다.
                if (place.place_url) {
                    const link = document.createElement("a");
                    link.className = "place-link";
                    link.href = place.place_url;
                    link.target = "_blank";
                    link.rel = "noopener noreferrer";
                    link.textContent = "카카오맵에서 상세 보기";

                    // 링크 클릭이 장소 항목 클릭으로 이어지지 않도록 합니다.
                    link.addEventListener("click", function (event) {
                        event.stopPropagation();
                    });

                    item.appendChild(link);
                }

                // 결과 항목을 클릭하면 지도 중심을 해당 장소로 이동합니다.
                function selectPlace() {
                    map.setCenter(position);
                    map.setLevel(5);

                    // 해당 장소의 이름을 정보창에 표시합니다.
                    infoWindow.setContent(
                        '<div style="padding:8px;font-size:13px;white-space:nowrap;">' +
                        escapeHtml(place.place_name) +
                        "</div>"
                    );

                    infoWindow.open(map, marker);
                }

                item.addEventListener("click", selectPlace);

                // 키보드로도 결과 항목을 선택할 수 있도록 합니다.
                item.addEventListener("keydown", function (event) {
                    if (event.key === "Enter" || event.key === " ") {
                        event.preventDefault();
                        selectPlace();
                    }
                });

                // 마커를 클릭해도 정보창을 표시합니다.
                kakao.maps.event.addListener(
                    marker,
                    "click",
                    selectPlace
                );

                resultList.appendChild(item);
            });

            // 검색된 장소들이 모두 보이도록 지도 범위를 조정합니다.
            if (data.length > 0) {
                map.setBounds(bounds);
            }
        }

        // 이전 검색 결과의 마커를 제거하는 함수입니다.
        function removeMarkers() {
            markers.forEach(function (marker) {
                marker.setMap(null);
            });

            markers = [];

            // 현재 위치 마커는 유지합니다.
            if (infoWindow) {
                infoWindow.close();
            }
        }

        // 정보창에 들어가는 텍스트의 HTML 특수문자를 처리합니다.
        function escapeHtml(value) {
            return String(value).replace(/[&<>"']/g, function (char) {
                const entities = {
                    "&": "&amp;",
                    "<": "&lt;",
                    ">": "&gt;",
                    '"': "&quot;",
                    "'": "&#39;"
                };

                return entities[char];
            });
        }
    </script>
</body>
</html>
